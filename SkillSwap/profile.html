
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>SkillSwap</h2>
    <a href="dashboard.html">Dashboard</a>
    <button onclick="logout()">Logout</button>
</header>

<main class="profile-container">
    <h1>My Profile</h1>

    <div class="profile-card">
        <h2 id="profileName"></h2>
        <p>Email: <span id="profileEmail"></span></p>
        <p>College: <span id="profileCollege"></span></p>
        <p>Course: <span id="profileCourse"></span></p>

        <hr>

        <h3>Skills I Teach</h3>
        <p id="profileTeach"></p>

        <h3>Skills I Want to Learn</h3>
        <p id="profileLearn"></p>

        <button onclick="enableEdit()">Edit Profile</button>
    </div>

    <form id="editForm" style="display:none;">
        <h2>Edit Profile</h2>

        <input type="text" id="editName" placeholder="Full Name" required>
        <input type="text" id="editCollege" placeholder="College" required>
        <input type="text" id="editCourse" placeholder="Course" required>
        <input type="text" id="editTeach" placeholder="Skills to Teach">
        <input type="text" id="editLearn" placeholder="Skills to Learn">

        <button type="submit">Save Changes</button>
    </form>
</main>

<script src="js/profile.js"></script>
</body>
</html>
