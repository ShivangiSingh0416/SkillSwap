
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Skills - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

    <header class="dashboard-navbar">
        <h2 class="logo">Skill<span>Swap</span></h2>
        <div>
            <span id="studentName">Student</span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="explore-main">

        <div class="explore-heading">
            <h1>Explore Skills</h1>
            <p>Discover talented students and learn something new!</p>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput"
                   placeholder="Search skills or student name...">

            <select id="categoryFilter">
                <option value="all">All Skills</option>
                <option value="programming">Programming</option>
                <option value="design">Design</option>
                <option value="marketing">Marketing</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="results-info">
            <h2>Available Students</h2>
            <span id="resultCount">0 students found</span>
        </div>

        <div class="student-grid" id="studentGrid">
            <!-- Student cards will appear here -->
        </div>

    </main>

    <script src="js/skills.js"></script>
</body>
</html>
